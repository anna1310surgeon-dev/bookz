# Keeps the free Supabase project awake: it pauses after 7 days without requests.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 5 * * *'   # every day, 05:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: sb_publishable_ZXdHyYSClHPESnf9ICv48g_YTTDdmEc" \
            "https://lehmxqwpwccuuvcnobyk.supabase.co/rest/v1/docs?select=id&limit=1")
          echo "Supabase answered $code"
          test "$code" = "200"
