<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bookz</title>
<meta name="theme-color" content="#EEEEF0">
<meta name="description" content="Bookz — трекер чтения: списки, сессии, цитаты и размышления">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Lora:ital,wght@1,400&display=swap">
<style>
/* Layout: mobile column (max 430px) on a grey page; white 24–28px cards without shadows; floating dark capsule tab bar; bottom sheets over a 45% scrim. Light only (Bookz · Light). */
:root{
  --bg-page:#EEEEF0; --bg-card:#FFFFFF; --bg-subtle:#F5F5F7; --bg-inverse:#17171A; --bg-disabled:#E8E8EC;
  --lav-50:#F3F0FC; --lav-100:#E4DDF8; --lav-200:#D2C7F3; --lav-400:#AE9BEA; --violet:#6B52C8;
  --pink-100:#F8E1F1; --pink-300:#EDB8DF;
  --t-primary:#17171A; --t-secondary:#6B6B74; --t-tertiary:#9A9AA3; --t-brand:#5B43B8; --t-inverse:#FFFFFF; --t-disabled:#A3A3AC;
  --i-brand:#6B52C8; --i-muted:#8A8A93; --i-inverse:#FFFFFF; --i-primary:#17171A;
  --b-subtle:#E6E6EA; --b-focus:#6B52C8;
  --error:#C8372D; --error-bg:#FCEBEA; --warn:#9A5A06; --warn-bg:#FDF2DF; --warn-b:#E7A93B;
  --scrim:rgba(23,23,26,.45);
  --heat0:#F0EFF3; --heat1:#E4DDF8; --heat2:#C8BBF0; --heat3:#9E88E4; --heat4:#6B52C8;
  --r8:8px; --r12:12px; --r16:16px; --r20:20px; --r24:24px; --r28:28px; --rf:999px;
  --font:"Mulish",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --quote:"Lora",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg-page)}
body{color:var(--t-primary);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-page)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--b-focus);outline-offset:2px}
p{margin:0}
.app{max-width:430px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px))}
.gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px}
.gate .logo{width:96px;height:96px;border-radius:24px;background:url(icons/icon-192.png) center/cover}
.rich img:not([src]),.thumbs img:not([src]){min-height:120px;background:var(--bg-subtle)}
.sync-dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t-tertiary)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* type */
.t-l{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.t-m{font-size:22px;line-height:1.25;font-weight:600;margin:0;text-wrap:balance}
.t-s{font-size:17px;line-height:1.3;font-weight:600;margin:0}
.b-l{font-size:17px;line-height:1.45}
.b-m{font-size:15px;line-height:1.45}
.b-mm{font-size:15px;line-height:1.4;font-weight:600}
.cap{font-size:13px;line-height:1.4}
.capm{font-size:13px;line-height:1.4;font-weight:600}
.micro{font-size:11px;line-height:1.3}
.num-xl{font-size:48px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num-l{font-size:32px;line-height:1.15;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.q{font-family:var(--quote);font-style:italic;font-size:17px;line-height:1.45}
.q-l{font-family:var(--quote);font-style:italic;font-size:21px;line-height:1.45}
.sec{color:var(--t-secondary)} .ter{color:var(--t-tertiary)} .brand{color:var(--t-brand)} .inv{color:var(--t-inverse)}
.clamp2,.clamp3,.clamp4,.clamp6{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{-webkit-line-clamp:2}.clamp3{-webkit-line-clamp:3}.clamp4{-webkit-line-clamp:4}.clamp6{-webkit-line-clamp:6}

/* icons */
.ic{width:24px;height:24px;flex:none;display:inline-block}
.ic svg{width:100%;height:100%;display:block;fill:none}
.ic-18{width:18px;height:18px}.ic-20{width:20px;height:20px}

/* cards & controls */
.card{background:var(--bg-card);border-radius:var(--r24);padding:20px}
.card-28{border-radius:var(--r28)}
.ibtn{width:44px;height:44px;border-radius:var(--rf);border:0;display:grid;place-items:center;flex:none;color:var(--i-brand);background:var(--bg-card);transition:transform .15s}
.ibtn:active{transform:scale(.94)}
.ibtn.inverse{background:var(--bg-inverse);color:var(--i-inverse)}
.ibtn.lav{background:var(--lav-100);color:var(--i-brand)}
.ibtn.subtle{background:var(--bg-subtle);color:var(--i-brand)}
.ibtn:disabled{background:var(--bg-disabled);color:var(--t-disabled);cursor:default}
.btn{height:50px;border-radius:var(--rf);border:0;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.m{height:44px;padding:0 16px}
.btn.primary{background:var(--bg-inverse);color:var(--t-inverse)}
.btn.secondary{background:var(--bg-card);color:var(--t-primary)}
.btn.lav{background:var(--lav-100);color:var(--t-primary)}
.btn.lav .ic,.btn.secondary .ic{color:var(--i-brand)}
.btn.subtle{background:var(--bg-subtle);color:var(--t-primary)}
.btn.subtle .ic{color:var(--i-brand)}
.btn:disabled{background:var(--bg-disabled);color:var(--t-disabled);cursor:default;transform:none}
.btn.block{width:100%}
.btn .ic{width:20px;height:20px}
.chip{height:40px;border-radius:var(--rf);border:0;padding:0 16px;background:var(--bg-card);color:var(--t-primary);font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.on-card .chip,.chip.sub{background:var(--bg-subtle)}
.chip[aria-pressed="true"]{background:var(--bg-inverse);color:var(--t-inverse)}
.chip .ic{width:18px;height:18px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--bg-subtle);border-radius:var(--rf);padding:4px;gap:2px}
.seg.on-page{background:var(--bg-card)}
.seg button{flex:1;height:36px;border:0;border-radius:var(--rf);background:none;color:var(--t-secondary);font-size:13px;white-space:nowrap;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--bg-inverse);color:var(--t-inverse);font-weight:600}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:var(--rf);font-size:13px;font-weight:600;background:var(--lav-100);color:var(--t-brand)}
.tag.white{background:var(--bg-card);color:var(--t-primary);font-weight:400}
.bar{height:6px;border-radius:var(--rf);background:var(--bg-card);overflow:hidden}
.bar.sub{background:var(--bg-subtle)}
.bar i{display:block;height:100%;background:var(--bg-inverse);border-radius:var(--rf)}
.bar.violet i{background:var(--violet)}
.label{font-size:13px;color:var(--t-secondary);margin-bottom:8px;display:block}
.field{display:flex;align-items:center;gap:8px;min-height:56px;border-radius:var(--r16);background:var(--bg-subtle);padding:0 16px;border:1.5px solid transparent;transition:border-color .15s,background .15s}
.field:focus-within{background:var(--bg-card);border-color:var(--b-focus)}
.field input,.field textarea{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;padding:14px 0}
.field textarea{resize:none;min-height:96px;line-height:1.45}
.field.q-field textarea{font-family:var(--quote);font-style:italic}
.field .suf{color:var(--t-tertiary);font-size:15px;white-space:nowrap}
.field.err{border-color:var(--error);background:var(--error-bg)}
.field.warn{border-color:var(--warn-b);background:var(--warn-bg)}
.hint{font-size:13px;margin-top:6px;color:var(--t-tertiary)}
.hint.brand{color:var(--t-brand)} .hint.err{color:var(--error)} .hint.warn{color:var(--warn)}
input::placeholder,textarea::placeholder{color:var(--t-tertiary)}

/* cover */
.cover{position:relative;width:40px;height:56px;border-radius:6px;flex:none;overflow:hidden;background:var(--lav-200)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14%;background:rgba(255,255,255,.35)}
.cover::after{content:"";position:absolute;left:28%;top:18%;width:48%;height:3px;border-radius:2px;background:rgba(255,255,255,.55);box-shadow:0 7px 0 -0.5px rgba(255,255,255,.55)}
.cover.l{width:96px;height:134px;border-radius:12px}
.cover.l::after{height:5px;box-shadow:0 12px 0 -1px rgba(255,255,255,.55)}
.cover.pink{background:var(--pink-300)} .cover.violet{background:var(--heat3)} .cover.ink{background:var(--bg-inverse)}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg-inverse);border-radius:var(--rf);padding:6px;display:flex;gap:4px;box-shadow:0 8px 24px rgba(23,23,26,.18)}
.tabbar button{width:56px;height:56px;border-radius:var(--rf);border:0;background:none;color:var(--i-muted);display:grid;place-items:center}
.tabbar button[aria-current="page"]{background:var(--lav-200);color:var(--i-primary)}

/* home */
.hello{display:flex;align-items:flex-start;gap:8px;padding:8px 0 4px}
.week .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:var(--rf);border:1.5px solid transparent}
.day .micro{color:var(--t-tertiary)}
.day b{font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.day.read{background:var(--lav-200)}
.day.today{border-color:var(--bg-inverse)}
.day.today.read{background:var(--bg-inverse);color:var(--t-inverse)}
.day.today.read .micro{color:rgba(255,255,255,.7)}
.day.future{opacity:.45}
.hero{position:relative;overflow:hidden;background:var(--lav-100);border-radius:var(--r28);padding:20px;min-height:260px}
.hero .art{position:absolute;right:-10px;top:-24px;width:230px;height:230px;background-size:cover;pointer-events:none}
.hero .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--lav-100) 0,rgba(228,221,248,0) 35%),linear-gradient(0deg,var(--lav-100) 0,rgba(228,221,248,0) 30%)}
.hero>*:not(.art){position:relative}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:var(--rf);background:var(--bg-card);font-size:13px;font-weight:600}
.hero-actions{display:flex;gap:8px;margin-top:16px}
.hero-actions .btn{flex:1;background:var(--bg-card);color:var(--t-primary)}
.hero-actions .btn .ic{color:var(--i-brand)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-ring{position:relative;width:104px;height:104px;margin:12px auto 8px}
.goal-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal-ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.series{background:var(--bg-inverse);color:var(--t-inverse);border-radius:var(--r24);padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:100%}
.series .ibtn{background:var(--lav-200);color:var(--i-primary);width:40px;height:40px}
.tile{background:var(--bg-subtle);border-radius:var(--r20);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile .dot{width:40px;height:40px;border-radius:var(--rf);background:var(--bg-card);display:grid;place-items:center;color:var(--i-brand)}
.heat{display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3)}.heat i.l4{background:var(--heat4)}
.heat i.fut{background:transparent}
.legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:13px;color:var(--t-tertiary)}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.qcard{flex:none;width:272px;height:232px;background:var(--bg-card);border-radius:var(--r24);padding:20px;display:flex;flex-direction:column;gap:16px;border:0;text-align:left}
.qcard .q{flex:1}
.qicon{width:44px;height:44px;border-radius:var(--rf);background:var(--lav-50);display:grid;place-items:center;color:var(--i-brand);flex:none}

/* lists */
.listcard{background:var(--lav-100);border-radius:var(--r28);padding:20px}
.listcard .chip{background:var(--bg-card)}
.search{display:flex;align-items:center;gap:8px;height:48px;border-radius:var(--rf);background:var(--bg-card);padding:0 16px;flex:1;min-width:0;color:var(--i-muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:15px;color:var(--t-primary)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px 0}
.blist{background:var(--bg-card);border-radius:var(--r24);overflow:hidden}
.brow{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 6px;border-bottom:1px solid var(--b-subtle);min-height:64px}
.brow:last-child{border-bottom:0}
.brow .st{width:44px;height:44px;border:0;background:none;padding:0;flex:none;display:grid;place-items:center}
.brow .st svg{width:44px;height:44px}
.brow .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;display:flex;align-items:center;gap:8px}
.brow .main .ic{color:var(--i-muted);width:20px;height:20px}

/* book */
.bk-head{display:flex;gap:16px;align-items:flex-start;margin-top:12px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;width:36px;height:36px;color:var(--violet)}
.stars svg{width:32px;height:32px}
.note{background:var(--lav-50);border-radius:var(--r16);padding:12px 16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:15px}
.kv span:first-child{color:var(--t-secondary)}
.kv span:last-child{text-align:right;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:12px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--lav-200);min-height:3px}
.bars i.zero{background:var(--b-subtle);height:3px!important}
.bars i.last{background:var(--violet)}

/* journal */
.entry{background:var(--bg-card);border-radius:var(--r24);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border:0;text-align:left;width:100%}
.e-head{display:flex;gap:10px;align-items:center}
.e-ico{width:36px;height:36px;border-radius:var(--r12);background:var(--lav-50);display:grid;place-items:center;color:var(--i-brand);flex:none}
.e-ico .ic{width:20px;height:20px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r16);background:var(--bg-subtle);display:block}
.thumbs.one{grid-template-columns:1fr 1fr}
.day-h{display:flex;align-items:baseline;gap:8px;padding:12px 4px 0}
mark{background:var(--lav-200);color:inherit;border-radius:3px;padding:0 1px}
.rich{color:var(--t-primary);overflow-wrap:anywhere}
.rich p{margin:0 0 8px} .rich>*:last-child{margin-bottom:0}
.rich h3{font-size:17px;font-weight:600;margin:8px 0 4px}
.rich ul,.rich ol{margin:0 0 8px;padding-left:22px}
.rich blockquote{margin:0 0 8px;padding:2px 0 2px 12px;border-left:3px solid var(--lav-200);font-family:var(--quote);font-style:italic}
.rich img{display:block;max-width:100%;border-radius:var(--r16);margin:8px 0}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 8px;color:var(--t-secondary)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0 auto;max-width:430px;max-height:92vh;max-height:92dvh;background:var(--bg-card);border-radius:var(--r28) var(--r28) 0 0;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--b-subtle);margin:8px auto 4px}
.sheet .s-head.none{display:none}
.sheet .s-head{display:flex;align-items:center;gap:12px;padding:8px 16px 12px}
.sheet .s-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.sheet .s-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.opt{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;border-radius:var(--r16);border:0;background:none;width:100%;text-align:left;font-size:15px}
.opt.sel{background:var(--lav-50)}
.opt svg{width:44px;height:44px;flex:none}
.opt .ic.chk{margin-left:auto;color:var(--i-brand)}
.pick{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--b-subtle)}
.bookfield{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;border-radius:var(--r20);background:var(--bg-subtle);border:1.5px solid transparent;width:100%;text-align:left}
.bookfield.err{border-color:var(--error);background:var(--error-bg)}
.bookfield .ic{color:var(--i-muted)}
.editor{border-radius:var(--r16);border:1.5px solid var(--b-subtle);background:var(--bg-card);overflow:hidden}
.editor:focus-within{border-color:var(--b-focus)}
.editor.err{border-color:var(--error)}
.e-bar{display:flex;gap:2px;padding:6px;background:var(--bg-subtle);flex-wrap:wrap}
.e-bar button{width:36px;height:36px;border:0;border-radius:var(--r8);background:none;color:var(--i-brand);display:grid;place-items:center}
.e-bar button[aria-pressed="true"]{background:var(--lav-100)}
.e-area{min-height:140px;max-height:40vh;overflow-y:auto;padding:12px 16px;outline:0;font-size:17px;line-height:1.45}
.e-area:empty::before{content:attr(data-ph);color:var(--t-tertiary)}
.e-area p{margin:0 0 8px} .e-area h3{font-size:17px;font-weight:600;margin:0 0 4px}
.e-area ul,.e-area ol{margin:0 0 8px;padding-left:22px}
.e-area blockquote{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--lav-200);font-family:var(--quote);font-style:italic}
.e-area img{max-width:100%;border-radius:var(--r12);display:block;margin:6px 0}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--t-secondary);padding:4px}
.act span.ib{width:48px;height:48px;border-radius:var(--rf);background:var(--bg-subtle);display:grid;place-items:center;color:var(--i-brand)}
.act.danger{color:var(--error)} .act.danger span.ib{background:var(--error-bg);color:var(--error)}

 classics:[['Древность','до V века',y=>y<500],['Средние века','V–XV века',y=>y<1500],['XVI–XVIII век','',y=>y<1800],['XIX век','',y=>y<1900],['XX век','',y=>y<2000],['XXI век','',()=>true]],

function eraOf(b){ const e=ERAS[b.list]; if(b.list==='english') return b.level||'B2'; if(!b.y) return e[e.length-1][0]; for(const [n,,f] of e) if(f(b.y)) return n; return e[e.length-1][0]; }

const DIFF=['','легко','средне','сложно'];
function bookMeta(b){ const parts=[b.a, fmtYear(b.y)]; if(b.region) parts.push(b.region); if(b.diff) parts.push(DIFF[b.diff]); if(b.level) parts.push(b.level+(b.kind==='nf'?' · нон-фикшн':'')); return parts.filter(Boolean).join(' · '); }

      <div class="row between cap ter" style="margin-top:8px"><span>${dShort(shown[0])}</span><span class="${bd[shown[shown.length-1]]?'brand':''}">${shown[shown.length-1]===today()?'сегодня':dShort(shown[shown.length-1])}${bd[shown[shown.length-1]]?` · ${bd[shown[shown.length-1]]} стр.`:''}</span></div></section>`; } }

  else { const tab=ui.bookTab; const items=tab==='quote'?qn:tab==='reflection'?rn:sn;
    rec=`<div class="seg on-page">${[['quote','Цитаты',qn.length],['reflection','Мысли',rn.length],['session','Сессии',sn.length]].map(([k,l,n])=>`<button type="button" data-act="bookTab" data-k="${k}" aria-pressed="${tab===k}">${l} · ${n}</button>`).join('')}</div>

  const about=`<section class="card"><h2 class="t-m">О книге</h2><div style="margin-top:8px"><div class="kv"><span>Страниц в издании</span><span>${r?.pagesTotal||'<span class="ter" style="font-weight:400">укажешь при старте</span>'}</span></div><div class="kv"><span>Перевод</span><span>${r?.translation?esc(r.translation):'—'}</span></div><div class="kv"><span>Список</span><span>${esc(LIST[b.list].name)}${b.pos?` · №${b.pos}`:''}</span></div>${b.region||b.level?`<div class="kv"><span>${b.region?'Регион':'Уровень'}</span><span>${esc(b.region||b.level)}</span></div>`:''}</div>
    ${r?`<button class="btn m subtle block" style="margin-top:12px" type="button" data-act="editBook" data-id="${b.id}">${I('journal')}Изменить данные книги</button>`:''}</section>`;
  return `<div class="stack">${head}${rchips}${sc}${compareCard(b)}${statsC}<h2 class="t-m" style="padding:8px 4px 0">Записи</h2>${rec}${about}</div>`;
}

/* ================= Entries ================= */
function hl(text){ const s=esc(text); const q=(ui.jSearch||'').trim(); if(!q||ui.view!=='journal') return s; const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); return s.replace(re,m=>`<mark>${m}</mark>`); }
function imgsOf(html){ const out=[]; (html||'').replace(/<img[^>]*>/g,tag=>{ const sbp=tag.match(/data-sb="([^"]+)"/); const da=tag.match(/src="(data:image\/[^"]+)"/); if(sbp) out.push(IMG_BASE+sbp[1]); else if(da) out.push(da[1]); else if(/data-asset=/.test(tag)) out.push(''); }); return out; }
function entryCard(e,o={}){ const b=bookById(e.bookId);
  const head=`<div class="e-head"><span class="e-ico">${I(e.type==='quote'?'quote':e.type==='session'?'book':'journal')}</span><div class="grow"><div class="cap ter">${e.type==='quote'?'Цитата':e.type==='session'?'Сессия':'Размышление'}${o.noBook?` · ${dLong(e.date)}`:''}</div>${o.noBook?'':`<div class="b-mm">${esc(b?.t||'Без книги')}</div>`}</div></div>`;
  let body='';
  if(e.type==='quote') body=`<div class="q">«${hl(e.text)}»</div>${e.page?`<div class="cap ter">стр. ${esc(e.page)}</div>`:''}`;
  else if(e.type==='session') body=`<div class="b-mm">+${gain(e)} стр. · стр. ${e.pageFrom||0} → ${e.pageTo}${e.minutes?` · ${fmtMin(+e.minutes)}`:''}</div>${e.text?`<div class="b-m sec clamp4">${hl(e.text)}</div>`:''}${imgThumbs(e.html)}`;
  else body=`${e.title?`<div class="t-s">${hl(e.title)}</div>`:''}${e.text?`<div class="b-m clamp6">${hl(e.text)}</div>`:''}${imgThumbs(e.html)}`;
  return `<button class="entry" type="button" data-act="viewEntry" data-id="${e.id}">${head}${body}</button>`;
}
function imgThumbs(html){ const im=imgsOf(html).slice(0,4); return im.length?`<div class="thumbs">${im.map(u=>u?`<img src="${esc(u)}" alt="" loading="lazy">`:`<img alt="Картинка ждёт переноса">`).join('')}</div>`:''; }

/* ================= Journal ================= */
function jMatch(bookId){ const f=ui.jBook; if(f==='all') return true; const b=bookById(bookId); if(f.startsWith('list:')) return b?.list===f.slice(5); if(f.startsWith('era:')){ const [,l,e]=f.split(':'); return !!b&&b.list===l&&eraOf(b)===e; } return bookId===f; }
function scopeLabel(f){ const all=allEntries(); if(f.startsWith('list:')){ const l=f.slice(5); return LIST[l].name; } if(f.startsWith('era:')){ const [,l,e]=f.split(':'); const n=new Set(all.filter(x=>{const b=bookById(x.bookId);return b&&b.list===l&&eraOf(b)===e;}).map(x=>x.bookId)).size; return `${e} · ${n} ${plural(n,'книга','книги','книг')}`; } return bookById(f)?.t||''; }
const WD_LONG=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function journalView(){
  const all=allEntries().sort((a,b)=>byTime(b,a));
  let es=all.filter(e=>jMatch(e.bookId)&&(!ui.jDay||e.date===ui.jDay));
  const n={all:es.length,session:0,reflection:0,quote:0}; for(const e of es) n[e.type]++;
  if(ui.jKind!=='all') es=es.filter(e=>e.type===ui.jKind);
  const q=(ui.jSearch||'').trim().toLowerCase(); if(q) es=es.filter(e=>[e.text,e.title,e.comment,bookById(e.bookId)?.t].some(x=>(x||'').toLowerCase().includes(q)));
  const recent=[...new Set(all.map(e=>e.bookId).filter(Boolean))].slice(0,3).map(bookById).filter(Boolean);
  const scoped=ui.jBook.includes(':');
  if(!scoped&&ui.jBook!=='all'&&!recent.find(b=>b.id===ui.jBook)){ const sb=bookById(ui.jBook); if(sb) recent.unshift(sb); }
  const chips=`<div class="hscroll"><button class="chip" type="button" data-act="jPick" aria-pressed="${ui.jBook==='all'}">Все книги${I('chevron-down')}</button>${scoped?`<button class="chip" type="button" data-act="jBook" data-id="${esc(ui.jBook)}" aria-pressed="true">${esc(scopeLabel(ui.jBook))}</button>`:''}${recent.map(b=>`<button class="chip" type="button" data-act="jBook" data-id="${b.id}" aria-pressed="${ui.jBook===b.id}">${esc(b.t)}</button>`).join('')}</div>`;
  const dayBar=ui.jDay?`<div class="row between"><span class="chip" style="background:var(--bg-inverse);color:#fff">${dLong(ui.jDay)}, ${WD_LONG[parseYmd(ui.jDay).getDay()]}</span><button class="b-mm brand" type="button" data-act="jAllDays" style="border:0;background:none">Все дни</button></div>`:'';
  const seg=`<div class="seg on-page">${[['all','Все'],['session','Сессии'],['reflection','Мысли'],['quote','Цитаты']].map(([k,l])=>`<button type="button" data-act="jKind" data-k="${k}" aria-pressed="${ui.jKind===k}">${l} · ${n[k]}</button>`).join('')}</div>`;
  let bookCard=''; if(ui.jBook!=='all'&&!scoped){ const b=bookById(ui.jBook); if(b) bookCard=`<div class="row" style="background:${b?'var(--lav-100)':''};border-radius:var(--r20);padding:12px 16px 12px 12px"><span class="cover ${coverColor(b)}"></span><div class="grow"><div class="b-mm">${esc(b.t)}</div><div class="cap sec">${STATUS_NAME[status(b.id)]} · ${n.all} ${plural(n.all,'запись','записи','записей')}</div></div><button class="b-mm brand" type="button" data-act="book" data-id="${b.id}" style="border:0;background:none">К книге</button></div>`; }
  const search=ui.jSearch!=null?`<div class="row"><label class="search">${I('search','ic-20')}<input id="jq" type="search" placeholder="Поиск по записям" value="${esc(ui.jSearch)}" autocomplete="off"></label><button class="ibtn" type="button" data-act="jSearchClose" aria-label="Закрыть поиск">${I('close')}</button></div>`:'';
  let body;
  if(!all.length) body=`<div class="card empty"><span class="qicon">${I('journal','ic-20')}</span><span>Здесь появятся сессии, мысли и цитаты</span><button class="btn m primary" type="button" data-act="new">${I('plus')}Новая запись</button></div>`;
  else if(!es.length) body=`<div class="card empty"><span>${q?'Ничего не нашлось':'Записей такого типа нет'}</span></div>`;
  else { const groups=[]; for(const e of es){ const g=groups[groups.length-1]; if(g&&g.d===e.date) g.items.push(e); else groups.push({d:e.date,items:[e]}); }
    body=groups.map(g=>{ const t=today(); const lab=g.d===t?'Сегодня':g.d===addDays(t,-1)?'Вчера':dLong(g.d); return `<div class="day-h"><span class="t-s">${lab}</span>${lab!==dLong(g.d)?`<span class="cap ter">${dLong(g.d)}</span>`:''}</div>${g.items.map(e=>entryCard(e)).join('')}`; }).join(''); }
  return `<div class="stack"><div class="hello"><h1 class="t-l grow">Дневник</h1><button class="ibtn" type="button" data-act="jSearchOpen" aria-label="Поиск">${I('search')}</button><button class="ibtn" type="button" data-act="calendar" aria-label="Календарь">${I('calendar')}</button></div>
    ${search}${chips}${seg}${dayBar}${bookCard}${body}</div>`;
}

/* ================= Sheets ================= */
let sheets=[];
function openSheet(s){ sheets.push(s); renderSheet(); }
function closeSheet(force){ const s=sheets[sheets.length-1]; if(!s) return; if(!force&&s.isDirty&&s.isDirty()&&!s.confirmExit){ s.confirmExit=true; renderSheet(); return; } if(s.onClose){ s.onClose(); return; } sheets.pop(); renderSheet(); }
function renderSheet(){
  const s=sheets[sheets.length-1];
  if(!s){ $('sheets').innerHTML=''; document.body.style.overflow=''; return; }
  document.body.style.overflow='hidden';
  const fullIdx=sheets.map((x,i)=>x.full?i:-1).filter(i=>i>=0).pop();
  const under=fullIdx!=null&&fullIdx>=0&&s!==sheets[fullIdx]?`<div class="celebrate" style="animation:none">${sheets[fullIdx].draw()}</div>`:'';
  if(s.full){ $('sheets').innerHTML=`<div class="celebrate" role="dialog" aria-modal="true">${s.draw()}</div>`; return; }
  const inner = s.confirmExit ? {title:'Выйти без сохранения?', body:`<p class="b-m sec">Запись не сохранится</p>`, foot:`<button class="btn primary block" type="button" data-sact="exitYes">Выйти</button><button class="btn lav block" type="button" data-sact="exitNo">Остаться</button>`} : s.draw();
  $('sheets').innerHTML=under+`<div class="scrim" data-sact="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(inner.title)}"><div class="handle"></div><div class="s-head ${inner.noHead?'none':''}"><h2 class="t-m grow">${esc(inner.title)}</h2><button class="ibtn subtle" type="button" data-sact="close" aria-label="Закрыть">${I('close')}</button></div><div class="s-body" id="sbody">${inner.body}</div>${inner.foot?`<div class="s-foot">${inner.foot}</div>`:''}</div>`;
  if(!s.confirmExit&&s.mount) s.mount();
}
function refreshSheet(){ const s=sheets[sheets.length-1]; if(!s||!s.live) return; const fe=document.activeElement; if(fe&&$('sheets').contains(fe)&&/INPUT|TEXTAREA/.test(fe.tagName)||fe&&fe.isContentEditable) return; renderSheet(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheets.length) closeSheet(); if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('[role="button"][data-act="goal"]')){ e.preventDefault(); goalSheet(); } });

/* --- status sheet --- */
function statusSheet(id){ const b=bookById(id); openSheet({ draw(){ const st=status(id); const r=curReading(id);
  return {title:b.t, body:`<p class="cap sec" style="margin-top:-12px">${esc([b.a,fmtYear(b.y)].filter(Boolean).join(' · '))}${r?.pagesTotal?` · ${r.pagesTotal} стр.`:''}</p><div>${['reading','want','read','dropped','none'].map(k=>`<button class="opt ${st===k?'sel':''}" type="button" data-sact="pickStatus" data-k="${k}">${STATUS_ICON(k)}<span>${STATUS_NAME[k]}</span>${st===k?I('check','chk'):''}</button>`).join('')}</div><p class="cap ter">«Читаю» поставит книгу на Главную</p>`}; },
  act(a,el){ if(a==='pickStatus'){ const k=el.dataset.k; if(k===status(id)){ closeSheet(true); return; } sheets.pop(); applyStatus(id,k); } } }); }
function applyStatus(id,k){
  const st=status(id), r=curReading(id);
  if(k==='reading'){ if(r&&!r.finishedAt&&st!=='reading'){ updBook(id,d=>{ d.status='reading'; const rr=d.readings[d.readings.length-1]; delete rr.droppedAt; }); renderSheet(); render(); toast(`«${bookById(id).t}» — на Главной`); return; } startSheet(id); return; }
  if(k==='dropped'){ dropSheet(id); return; }
  if(k==='read'){ updBook(id,d=>{ let rr=d.readings[d.readings.length-1]; if(!rr||rr.finishedAt){ rr={id:uid('r'),startedAt:today()}; d.readings.push(rr); } rr.finishedAt=today(); delete rr.droppedAt; if(rr.pagesTotal) rr.page=rr.pagesTotal; d.status='read'; }); sheets=[]; celebrate(id); return; }
  updBook(id,d=>{ d.status=k; if(k==='want') d.wantSince=today(); }); renderSheet(); render(); toast(k==='want'?'Добавила в «Хочу прочитать»':'Статус снят');
}

/* --- start reading sheet (07.7) --- */
function startSheet(id){ const b=bookById(id); const prev=readings(id).slice(-1)[0]; const st={pages:prev?.pagesTotal||'',tr:prev?.translation||'',when:'today',date:today()};
  openSheet({ draw(){ return {title:`Начинаем «${b.t.length>22?b.t.slice(0,21)+'…':b.t}»`, body:`
    <div><label class="label" for="sp">Страниц в твоём издании</label><div class="field"><input id="sp" inputmode="numeric" value="${esc(st.pages)}" placeholder="Напр. 480"></div><p class="hint">Нужно, чтобы считать прогресс. Поменять можно в «О книге»</p></div>
    <div><label class="label" for="str">Перевод или издание</label><div class="field"><input id="str" value="${esc(st.tr)}" placeholder="Напр. В. Жуковский"></div><p class="hint">Необязательно</p></div>
    <div><span class="label">Когда начала</span>${whenChips(st)}</div>`, foot:`<button class="btn primary block" type="button" data-sact="go">Начать читать</button>`}; },
   mount(){ $('sp').oninput=e=>st.pages=e.target.value.replace(/\D/g,''); $('str').oninput=e=>st.tr=e.target.value; bindWhen(st); },
   act(a){ if(a==='go'){ const p=parseInt(st.pages,10); updBook(id,d=>{ d.status='reading'; d.readings.push({id:uid('r'),startedAt:st.date,...(p>0?{pagesTotal:p}:{}),...(st.tr.trim()?{translation:st.tr.trim()}:{})}); }); sheets=[]; renderSheet(); go('home'); toast(`«${b.t}» — на Главной`); } } }); }
function whenChips(st){ return `<div class="wrap">${[['today','Сегодня'],['yesterday','Вчера'],['other','Другой день']].map(([k,l])=>`<button class="chip sub" type="button" data-when="${k}" aria-pressed="${st.when===k}">${l}</button>`).join('')}</div>${st.when==='other'?`<div class="field" style="margin-top:8px"><input id="wdate" type="date" value="${st.date}" max="${today()}"></div>`:''}`; }
function bindWhen(st){ document.querySelectorAll('[data-when]').forEach(b=>b.onclick=()=>{ st.when=b.dataset.when; st.date=st.when==='today'?today():st.when==='yesterday'?addDays(today(),-1):st.date; renderSheet(); }); const w=$('wdate'); if(w) w.onchange=e=>st.date=e.target.value||today(); }

/* --- drop sheet (07.8) --- */
function dropSheet(id){ const b=bookById(id); const st={reason:'',comment:''}; const RS=[['not_for_me','Не моё'],['not_now','Не время'],['hard','Тяжело'],['boring','Скучно'],['other','Другое']];
  openSheet({ draw(){ return {title:'Почему бросила?', body:`<p class="b-m sec" style="margin-top:-8px">«${esc(b.t)}» — прогресс и записи сохранятся</p><div class="wrap">${RS.map(([k,l])=>`<button class="chip sub" type="button" data-sact="reason" data-k="${k}" aria-pressed="${st.reason===k}">${l}</button>`).join('')}</div><div><label class="label" for="dc">Комментарий</label><div class="field"><textarea id="dc" rows="3" placeholder="Например: вернусь, когда дочитаю Гомера">${esc(st.comment)}</textarea></div></div>`, foot:`<button class="btn primary block" type="button" data-sact="ok">Сохранить</button>`}; },

/* --- goal sheet (05.2–05.4) --- */
function goalSheet(){ const Y=new Date().getFullYear(); const done=readDoneIn(Y); const cur=docs['goal_'+Y]?.target; const st={v:Math.max(cur||10,done,1)};
  openSheet({ draw(){ const gc=goalCalc(st.v,Y); const amb=gc.left>0&&gc.avg>0&&gc.need>=2*gc.avg&&gc.need>=1.5; const atMin=st.v<=Math.max(done,1);
    const ratio=gc.avg?gc.need/gc.avg:0;
    return {title:`Цель на ${Y}`, body:`<div class="stepper"><button class="ibtn" type="button" data-sact="minus" aria-label="Меньше" ${atMin?'disabled':''}><svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 12H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><div class="grow" style="text-align:center"><div class="num-xl">${st.v}</div><div class="cap sec">${plural(st.v,'книга','книги','книг')} до конца года</div></div><button class="ibtn" type="button" data-sact="plus" aria-label="Больше">${I('plus')}</button></div>
      ${atMin&&done?`<p class="cap ter" style="text-align:center;margin-top:-8px">Ты уже прочитала ${done} ${plural(done,'книгу','книги','книг')} — меньше не получится</p>`:''}
      <div class="row" style="gap:8px">${[6,10,12,20].filter(n=>n>=done).map(n=>`<button class="chip sub grow" style="justify-content:center;padding:0 8px" type="button" data-sact="set" data-v="${n}" aria-pressed="${st.v===n}">${n} книг</button>`).join('')}</div>
      <div class="sum ${amb?'amb':''}"><div class="kv"><span>Уже прочитано</span><span>${done} ${plural(done,'книга','книги','книг')}</span></div><div class="kv"><span>Осталось</span><span>${gc.left} ${plural(gc.left,'книга','книги','книг')}</span></div><div class="kv"><span>До конца года</span><span>${gc.weeksLeft} ${plural(gc.weeksLeft,'неделя','недели','недель')}</span></div>
        <div class="kv pace"><span>Нужный темп</span><span>${paceText(gc.need)}</span></div>${amb?`<p class="cap" style="color:var(--warn);margin-top:6px">Это ${ratio>=2.5?`в ${dec(ratio)} раза`:'вдвое'} быстрее твоего обычного темпа. Амбициозно — цель можно поменять в любой момент</p>`:''}</div>`,
      foot:`<button class="btn primary block" type="button" data-sact="ok">Сохранить цель</button>`}; },
   act(a,el){ if(a==='minus'){ st.v=Math.max(done,1,st.v-1); renderSheet(); } if(a==='plus'){ st.v=Math.min(500,st.v+1); renderSheet(); } if(a==='set'){ st.v=+el.dataset.v; renderSheet(); } if(a==='ok'){ setDoc('goal_'+Y,{kind:'goal',year:Y,target:st.v}); closeSheet(true); render(); toast(`Цель — ${st.v} ${plural(st.v,'книга','книги','книг')} до конца года`); } } }); }

/* --- 04 · finish flow --- */
function readingStats(id,r){ const ss=r?sessions(id,r.id):[]; const pages=ss.length?ss.reduce((a,x)=>a+gain(x),0):(r?.pagesTotal||0); const mins=ss.reduce((a,x)=>a+(+x.minutes||0),0);
  let days=new Set(ss.map(x=>x.date)).size; if(!days&&r?.startedAt&&r?.finishedAt){ days=Math.round((parseYmd(r.finishedAt)-parseYmd(r.startedAt))/864e5)+1; }
  const q=quotes(id).filter(x=>!x.readingId||x.readingId===r?.id).length, rf=reflections(id).length; return {pages,mins,days:Math.max(days,1),q,rf}; }
function askFinish(id){ const b=bookById(id); const r=curReading(id); const Y=new Date().getFullYear(); const gc=goalCalc(docs['goal_'+Y]?.target||0,Y);
  openSheet({ draw(){ return {title:'Дочитала?', noHead:true, body:`<div class="artcard" style="background-image:url(${HERO})"></div><h2 class="t-l">Дочитала «${esc(b.t)}»?</h2><p class="b-m sec" style="margin-top:-12px">${r?.pagesTotal?`Ты дошла до ${r.pagesTotal}-й страницы из ${r.pagesTotal}. `:''}Отметим книгу прочитанной${gc.target?` — цель года станет ${gc.done+1}/${gc.target}`:''}</p>`, foot:`<button class="btn primary block" type="button" data-sact="yes">Да, дочитала</button><button class="btn lav block" type="button" data-sact="no">Ещё нет, только сессия</button>`}; },
   act(a){ if(a==='yes'){ sheets=[]; finishBook(id); celebrate(id); } if(a==='no'){ sheets=[]; renderSheet(); render(); toast('Сессия записана'); } } }); }
function celebrate(id){ const b=bookById(id); const Y=new Date().getFullYear();
  const s={ full:true, draw(){ const r=curReading(id); const st=readingStats(id,r); const gc=goalCalc(docs['goal_'+Y]?.target||0,Y); const n=gc.done; const C=2*Math.PI*16; const gp=gc.target?Math.min(1,gc.done/gc.target):0;
    return `<div class="in"><div class="art" style="background-image:url(${HERO})"></div><button class="ibtn x" type="button" data-sact="close" aria-label="Закрыть">${I('close')}</button>
      <div style="margin-top:-40px;position:relative"><span class="pill">${n<=ORD.length?ORD[n-1]:n+'-я'} книга в ${Y}</span><h1 class="t-l" style="margin-top:12px">«${esc(b.t)}» прочитана</h1><p class="b-m sec" style="margin-top:4px">${st.days} ${plural(st.days,'день','дня','дней')} — от первой до последней страницы</p></div>
      <div class="card" style="margin-top:20px"><div class="duo" style="gap:16px 12px"><div><div class="num-l">${st.days}</div><div class="cap sec">${plural(st.days,'день','дня','дней')} чтения</div></div><div><div class="num-l">${st.pages||'—'}</div><div class="cap sec">${plural(st.pages,'страница','страницы','страниц')}</div></div><div><div class="num-l">${st.mins?fmtMinShort(st.mins):'—'}</div><div class="cap sec">чтения</div></div><div><div class="num-l">${st.q}</div><div class="cap sec">${plural(st.q,'цитата','цитаты','цитат')} и ${st.rf} ${plural(st.rf,'размышление','размышления','размышлений')}</div></div></div>
        ${gc.target?`<div class="row" style="border-top:1px solid var(--b-subtle);margin-top:16px;padding-top:14px;gap:12px"><svg viewBox="0 0 40 40" width="40" height="40" style="transform:rotate(-90deg);flex:none"><circle cx="20" cy="20" r="16" fill="none" stroke="var(--lav-50)" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="var(--violet)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-gp)}"/></svg><div><div class="b-mm">Цель ${Y}: ${gc.done} из ${gc.target}</div><div class="cap sec">${gc.left?`Осталось ${gc.left} ${plural(gc.left,'книга','книги','книг')} за ${gc.weeksLeft} ${plural(gc.weeksLeft,'неделю','недели','недель')}`:'Цель выполнена!'}</div></div></div>`:''}</div>
      <div class="stack" style="margin-top:auto;padding-top:20px;gap:8px"><button class="btn primary block" type="button" data-sact="rate">${r?.rating?'Изменить оценку':'Оценить книгу'}</button><button class="btn secondary block" type="button" data-sact="next">Выбрать следующую книгу</button></div></div>`; },
    act(a){ if(a==='rate') rateSheet(id); if(a==='next') nextSheet(id); } };
  s.onClose=()=>{ sheets=[]; renderSheet(); go('home'); toast(`«${b.t}» — в прочитанных`); };
  openSheet(s); render(); }
function rateSheet(id,rid){ const b=bookById(id); const r=readings(id).find(x=>x.id===rid)||curReading(id); const st={rt:r?.rating||0,t:r?.review||''}; const LAB=['Поставь оценку',...RLAB.slice(1)];
  openSheet({ draw(){ return {title:`Как тебе «${b.t.length>18?b.t.slice(0,17)+'…':b.t}»?`, body:`<div style="text-align:center"><div class="stars" style="justify-content:center">${[1,2,3,4,5].map(i=>`<button type="button" data-sact="star" data-r="${i}" aria-label="${i} из 5">${STAR(i<=st.rt)}</button>`).join('')}</div><p class="cap brand" style="margin-top:4px">${LAB[st.rt]}</p></div>
      <div><label class="label" for="rv">Отзыв</label><div class="field"><textarea id="rv" rows="3" placeholder="Что запомнилось, кому посоветуешь">${esc(st.t)}</textarea></div><p class="hint">Необязательно</p></div>`, foot:`<button class="btn primary block" type="button" data-sact="ok" ${st.rt?'':'disabled'}>Сохранить оценку</button>`}; },
   mount(){ $('rv').oninput=e=>st.t=e.target.value; },
   act(a,el){ if(a==='star'){ st.rt=+el.dataset.r; renderSheetKeepFocus('rv'); } if(a==='ok'){ updBook(id,d=>{ const rr=d.readings.find(x=>x.id===r?.id)||d.readings[d.readings.length-1]; if(!rr) return; rr.rating=st.rt; if(st.t.trim()) rr.review=st.t.trim(); else delete rr.review; }); closeSheet(true); render(); toast('Оценка сохранена'); } } }); }
function nextSheet(fromId){ const from=bookById(fromId); const busy=k=>['read','reading','dropped'].includes(status(k));
  const course=booksOf(from.list).filter(b=>b.pos>from.pos&&!busy(b.id)); const feat=course.find(b=>status(b.id)==='want')||course[0]||nextBook();
  const wants=allBooks().filter(b=>status(b.id)==='want'&&b.id!==feat?.id).slice(0,3);
  const pagesOf=k=>readings(k).slice(-1)[0]?.pagesTotal;
  openSheet({ draw(){ const fp=pagesOf(feat.id); const sameAuthor=feat.a&&feat.a===from.a&&!feat.a.startsWith('автор');
    const row=b=>`<button class="pick" type="button" data-sact="pick" data-id="${b.id}"><span class="cover ${coverColor(b)}"></span><span class="grow"><span class="b-mm" style="display:block">${esc(b.t)}</span><span class="cap ter">${esc(b.a)}${pagesOf(b.id)?` · ${pagesOf(b.id)} стр.`:''}</span></span></button>`;
    return {title:'Что читаем дальше?', body:`<button class="feat" type="button" data-sact="pick" data-id="${feat.id}"><span class="cover l ${coverColor(feat)}" style="width:80px;height:112px"></span><span class="grow"><span class="pill">Следующая по курсу</span><span class="t-m" style="display:block;margin-top:10px">${esc(feat.t)}</span><span class="cap sec">${esc(feat.a)}${fp?` · ${fp} стр.`:''}${sameAuthor?` · продолжение «${esc(from.t)}»`:feat.pos?` · №${feat.pos} в курсе`:''}</span></span></button>
      ${wants.length?`<div><span class="label">Или из списка «Хочу прочитать»</span>${wants.map(row).join('')}</div>`:''}`,
      foot:`<button class="btn primary block" type="button" data-sact="pick" data-id="${feat.id}">Начать «${esc(feat.t.length>18?feat.t.slice(0,17)+'…':feat.t)}»</button><button class="btn lav block" type="button" data-sact="later">Выберу позже</button>`}; },
   act(a,el){ if(a==='pick'){ startSheet(el.dataset.id); } if(a==='later'){ sheets=[]; renderSheet(); go('home'); toast(`«${from.t}» — в прочитанных`); } } }); }

/* --- review sheet --- */

      <div><span class="label">Сортировка</span><div class="wrap">${c('o','chrono',ui.list==='english'?'По уровню':'По хронологии')}${c('o','title','По названию')}${c('o','author','По автору')}</div></div>`,

   act(a,el){ if(a==='f'){ st[el.dataset.g]=el.dataset.k; renderSheet(); } if(a==='reset'){ st.s='all'; st.r='all'; st.o='chrono'; renderSheet(); } if(a==='ok'){ Object.assign(ui,{fStatus:st.s,fRegion:st.r,sort:st.o}); closeSheet(true); render(); } } }); }

/* --- book picker --- */
function pickerSheet(onPick,opts={}){ const st={q:''};
  openSheet({ draw(){ const q=st.q.trim().toLowerCase(); const rd=readingBooks(); const withRec=[...new Set(allEntries().sort((a,b)=>byTime(b,a)).map(e=>e.bookId))].map(bookById).filter(Boolean);
    const row=b=>`<button class="pick" type="button" data-sact="pick" data-id="${b.id}"><span class="cover ${coverColor(b)}"></span><span class="grow"><span class="b-mm" style="display:block">${esc(b.t)}</span><span class="cap ter">${esc(b.a)}${status(b.id)!=='none'?' · '+STATUS_NAME[status(b.id)]:''}</span></span></button>`;
    let body=`<label class="search" style="background:var(--bg-subtle);flex:none">${I('search','ic-20')}<input id="pq" type="search" placeholder="Найти книгу" value="${esc(st.q)}" autocomplete="off"></label>`;
    if(opts.allOption) body+=`<button class="pick" type="button" data-sact="pick" data-id="all"><span class="grow b-mm">Все книги</span></button>`;
    if(q){ const res=allBooks().filter(b=>(!opts.onlyWithRecords||withRec.includes(b))&&(b.t.toLowerCase().includes(q)||(b.a||'').toLowerCase().includes(q))).slice(0,40); body+=res.length?`<div>${res.map(row).join('')}</div>`:`<p class="b-m sec">Ничего не нашлось</p>`; }
    else { if(rd.length&&!opts.onlyWithRecords) body+=`<div><span class="label">Читаю сейчас</span>${rd.map(row).join('')}</div>`; const rec=withRec.filter(b=>opts.onlyWithRecords||!rd.includes(b)).slice(0,opts.onlyWithRecords?50:6); if(rec.length) body+=`<div><span class="label">${opts.onlyWithRecords?'Книги с записями':'Недавние записи'}</span>${rec.map(row).join('')}</div>`; if(!opts.onlyWithRecords){ const want=allBooks().filter(b=>status(b.id)==='want').slice(0,6); if(want.length) body+=`<div><span class="label">Хочу прочитать</span>${want.map(row).join('')}</div>`; body+=`<p class="cap ter">Поиск — по всем ${allBooks().length} книгам из списков</p>`; } }
    return {title:opts.title||'Выбор книги', body}; },
   mount(){ const i=$('pq'); i.oninput=e=>{ st.q=e.target.value; const pos=i.selectionStart; renderSheet(); const n=$('pq'); n.focus(); n.setSelectionRange(pos,pos); }; },
   act(a,el){ if(a==='pick'){ sheets.pop(); onPick(el.dataset.id); renderSheet(); } } }); }

/* --- entry sheet (01–03) --- */
function entrySheet(preset={}){
  const ex=preset.id?{...docs[preset.id]}:null;
  const type0=ex?(ex.kind==='reflection'?'reflection':ex.kind):(preset.type||'session');
  const defBook=preset.book||(ex?ex.bookId:'')||(readingBooks()[0]?.id||'');
  const st={type:type0, book:defBook, page:ex?.kind==='session'?String(ex.pageTo):'', minutes:ex?.minutes||0, minOther:false, when:'today', date:ex?.date||today(), html:ex?.html||'', showThoughts:!!(ex?.html), title:ex?.title||'', qtext:ex?.kind==='quote'?ex.text:'', qpage:ex?.page||'', comment:ex?.comment||'', tried:false, confirmFinish:false};
  if(ex){ st.when=st.date===today()?'today':st.date===addDays(today(),-1)?'yesterday':'other'; }
  const snap=JSON.stringify(st);
  const s={ live:false,
    isDirty(){ const c={...st,tried:false}; return JSON.stringify(c)!==JSON.stringify({...JSON.parse(snap),tried:false}); },
    draw(){
      if(st.confirmFinish){ const b=bookById(st.book); return {title:'Дочитала?', body:`<p class="b-l">Это последняя страница «${esc(b.t)}». Отметить книгу прочитанной?</p>`, foot:`<button class="btn primary block" type="button" data-sact="finishYes">Да, дочитала</button><button class="btn lav block" type="button" data-sact="finishNo">Ещё нет</button>`}; }
      const b=st.book?bookById(st.book):null; const r=b?curReading(b.id):null; const pt=r&&status(b.id)==='reading'?r.pagesTotal:null; const lp=b&&status(b.id)==='reading'?lastPage(b.id):0;
      const seg=ex?'':`<div class="seg">${[['session','Сессия'],['reflection','Размышление'],['quote','Цитата']].map(([k,l])=>`<button type="button" data-sact="type" data-k="${k}" aria-pressed="${st.type===k}">${l}</button>`).join('')}</div>`;
      const bookErr=st.tried&&!st.book;
      const bookF=`<div><span class="label">Книга</span><button class="bookfield ${bookErr?'err':''}" type="button" data-sact="pickBook">${b?`<span class="cover ${coverColor(b)}"></span><span class="grow"><span class="b-mm" style="display:block">${esc(b.t)}</span><span class="cap sec">${esc(b.a)}${pt?` · стр. ${lp} из ${pt}`:''}</span></span>`:`<span class="grow b-m ter">Выбери книгу</span>`}${I('chevron-right')}</button>${bookErr?`<p class="hint err">Выбери книгу — без неё запись не сохранить</p>`:''}</div>`;
      let body=seg, btn='';
      if(st.type==='session'){
        const p=parseInt(st.page,10); let cls='', hint='';
        if(st.page!==''&&p>=0){ if(pt&&p>pt){ cls='err'; hint=`<p class="hint err">В книге всего ${pt} стр.</p>`; } else if(p<lp){ cls='warn'; hint=`<p class="hint warn">Меньше, чем в прошлый раз (${lp}). Перечитываешь? Сохранить можно</p>`; } else hint=`<p class="hint brand">+${p-lp} стр. с прошлого раза</p>`; }
        else if(st.tried){ cls='err'; hint=`<p class="hint err">Укажи страницу, на которой остановилась</p>`; }
        const mins=[15,30,45,60,90,120];
        body+=bookF+`<div><label class="label" for="pg">Остановилась на странице</label><div class="field ${cls}"><input id="pg" inputmode="numeric" placeholder="${lp?`В прошлый раз — ${lp}`:'Номер страницы'}" value="${esc(st.page)}" autocomplete="off">${pt?`<span class="suf">из ${pt}</span>`:''}</div>${hint}</div>
          <div><span class="label">Сколько читала</span><div class="hscroll">${mins.map(m=>`<button class="chip sub" type="button" data-sact="min" data-m="${m}" aria-pressed="${!st.minOther&&+st.minutes===m}">${fmtMin(m).replace('1 ч 30 мин','1,5 часа').replace('2 ч','2 часа').replace('1 ч','1 час')}</button>`).join('')}<button class="chip sub" type="button" data-sact="minOther" aria-pressed="${st.minOther}">Другое</button></div>${st.minOther?`<div class="field" style="margin-top:8px"><input id="mo" inputmode="numeric" placeholder="Минут" value="${st.minutes||''}"><span class="suf">мин</span></div>`:''}</div>
          <div><span class="label">Когда</span>${whenChips(st)}</div>
          ${st.showThoughts?`<div><span class="label">Мысли</span>${editorHtml('ed',st.html,'Что зацепило, что непонятно…')}<p class="hint">Картинку можно вставить из буфера</p></div>`:`<button class="btn m lav" type="button" data-sact="thoughts" style="align-self:flex-start">${I('plus')}Добавить мысли</button>`}`;
        btn=`<button class="btn primary block" type="button" data-sact="save" ${st.book&&st.page!==''&&!(pt&&p>pt)?'':'aria-disabled="true" style="background:var(--bg-disabled);color:var(--t-disabled)"'}>${ex?'Сохранить':'Добавить сессию'}</button>`;
      } else if(st.type==='quote'){
        const err=st.tried&&!st.qtext.trim();
        body+=`<div><label class="label" for="qt">Цитата</label><div class="field q-field ${err?'err':''}"><textarea id="qt" rows="4" placeholder="Текст цитаты">${esc(st.qtext)}</textarea></div>${err?`<p class="hint err">Добавь текст цитаты</p>`:''}</div>`+bookF+
          `<div><label class="label" for="qp">Страница</label><div class="field"><input id="qp" inputmode="numeric" value="${esc(st.qpage)}" placeholder="Необязательно">${pt?`<span class="suf">из ${pt}</span>`:''}</div></div>
           <div><label class="label" for="qc">Комментарий</label><div class="field"><textarea id="qc" rows="2" placeholder="Почему запомнилось">${esc(st.comment)}</textarea></div></div>`;
        btn=`<button class="btn primary block" type="button" data-sact="save">${ex?'Сохранить':'Сохранить цитату'}</button>`;
      } else {
        const err=st.tried&&!plainText(st.html).trim()&&!/<img/.test(st.html);
        body+=bookF+`<div><span class="label">Когда</span>${whenChips(st)}</div><div><label class="label" for="rt">Заголовок</label><div class="field"><input id="rt" value="${esc(st.title)}" placeholder="Необязательно"></div></div>
          <div><span class="label">Текст</span>${editorHtml('ed',st.html,'Мысли, выводы, схемы… Картинку можно вставить из буфера или перетащить',err)}${err?`<p class="hint err">Напиши хотя бы пару слов или добавь картинку</p>`:''}</div>`;
        btn=`<button class="btn primary block" type="button" data-sact="save">${ex?'Сохранить':'Сохранить размышление'}</button>`;
      }
      return {title:ex?'Изменить запись':'Новая запись', body, foot:btn};
    },
    mount(){
      const on=(id,f)=>{const el=$(id); if(el) el.oninput=f;};
      on('pg',e=>{ st.page=e.target.value.replace(/\D/g,''); updateSessionHint(); });
      on('mo',e=>{ st.minutes=parseInt(e.target.value.replace(/\D/g,''),10)||0; });
      on('qt',e=>st.qtext=e.target.value); on('qp',e=>st.qpage=e.target.value); on('qc',e=>st.comment=e.target.value); on('rt',e=>st.title=e.target.value);
      bindWhen(st); if($('ed')) mountEditor('ed',h=>st.html=h);
      if(!ex&&st.type==='quote'&&!st.qtext) $('qt')?.focus();
    },
    act(a,el){
      if(a==='type'){ st.type=el.dataset.k; st.tried=false; renderSheet(); }
      if(a==='pickBook') pickerSheet(id=>{ st.book=id; });
      if(a==='min'){ st.minOther=false; st.minutes=+st.minutes===+el.dataset.m?0:+el.dataset.m; renderSheet(); }
      if(a==='minOther'){ st.minOther=!st.minOther; renderSheet(); }

const OK_TAGS={P:'p',BR:'br',B:'strong',STRONG:'strong',I:'em',EM:'em',U:'u',H1:'h3',H2:'h3',H3:'h3',H4:'h3',UL:'ul',OL:'ol',LI:'li',BLOCKQUOTE:'blockquote',DIV:'p',IMG:'img'};

      if(sbp&&/^[0-9a-f-]{36}\/[A-Za-z0-9_-]{1,80}\.(jpg|png|webp)$/.test(sbp)){ const im=document.createElement('img'); im.setAttribute('src',IMG_BASE+sbp); im.setAttribute('data-sb',sbp); im.setAttribute('alt',''); im.setAttribute('loading','lazy'); dst.appendChild(im); continue; }
      if(id&&/^[A-Za-z0-9_-]{1,80}$/.test(id)){ const im=document.createElement('img'); im.setAttribute('data-asset',id); im.setAttribute('alt','Картинка ждёт переноса'); dst.appendChild(im); continue; }
      if(/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(src)) u=src; if(u){ const im=document.createElement('img'); im.setAttribute('src',u); im.setAttribute('alt',''); im.setAttribute('loading','lazy'); dst.appendChild(im); } continue; }

    const el=document.createElement(t); dst.appendChild(el); if(t!=='br') walk(n,el); } };

    for(const id of ids){ toast(`Переношу картинки… ${n+1} из ${ids.length}`); const blob=await (await fetch(j.images[id])).blob(); const path=`${me}/${id}.jpg`; const {error}=await sb.storage.from('images').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:true}); if(error) throw error; map[id]=path; n++; }
    for(const [key,d] of Object.entries(docs)){ if(!/data-asset=/.test(d.html||'')) continue; const tpl=document.createElement('template'); tpl.innerHTML=d.html;
      tpl.content.querySelectorAll('img[data-asset]').forEach(im=>{ const p=map[im.getAttribute('data-asset')]; if(p){ im.removeAttribute('data-asset'); im.setAttribute('data-sb',p); im.setAttribute('src',IMG_BASE+p); } });
      setDoc(key,{...d,html:sanitize(tpl.innerHTML)}); }
    render(); toast(`Готово: ${n} ${plural(n,'картинка перенесена','картинки перенесены','картинок перенесено')}`);
  }catch(err){ toast('Это не тот файл. Нужен bookz-images.json','err'); } });

/* ================= Toast ================= */
let tt; function toast(msg,kind){ $('toastRoot').innerHTML=`<div class="toast ${kind||''}" role="status"><span class="ok">${I(kind==='err'?'close':'check','ic-20')}</span><span>${esc(msg)}</span></div>`; clearTimeout(tt); tt=setTimeout(()=>$('toastRoot').innerHTML='',2800); }

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const sa=e.target.closest('[data-sact]');
  if(sa&&$('sheets').contains(sa)){ const a=sa.dataset.sact; const s=sheets[sheets.length-1];
    if(a==='scrim'||a==='close'){ closeSheet(); return; } if(a==='exitYes'){ closeSheet(true); return; } if(a==='exitNo'){ s.confirmExit=false; renderSheet(); return; }
    if(s&&s.act) s.act(a,sa); return; }
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const hd=e.target.closest('[data-day]'); if(hd&&$('view').contains(hd)){ go('journal',{jDay:hd.dataset.day,jKind:'all',jBook:'all'}); return; }
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act;
  if(a==='importImages') $('importFile').click();
  else if(a==='new') entrySheet({type:t.dataset.type,book:t.dataset.book});
  else if(a==='book') openBook(t.dataset.id);
  else if(a==='back') go(ui.prevView||'home');
  else if(a==='status') statusSheet(t.dataset.id);
  else if(a==='setStatus') applyStatus(t.dataset.id,t.dataset.s);
  else if(a==='start') startSheet(t.dataset.id);
  else if(a==='resume') applyStatus(t.dataset.id,'reading');
  else if(a==='editBook') editBookSheet(t.dataset.id);
  else if(a==='review') rateSheet(ui.bookId,t.dataset.rid);
  else if(a==='readingSel'){ ui.readingSel=t.dataset.id; render(); }
  else if(a==='rate'){ const v=+t.dataset.r, rid=t.dataset.rid; updBook(ui.bookId,d=>{ const rr=d.readings.find(x=>x.id===rid)||d.readings[d.readings.length-1]; if(rr) rr.rating=rr.rating===v?0:v; }); render(); }
  else if(a==='goal') goalSheet();
  else if(a==='weekPrev'){ ui.weekOffset--; render(); } else if(a==='weekNext'){ ui.weekOffset=Math.min(0,ui.weekOffset+1); render(); }
  else if(a==='period'){ ui.statPeriod=t.dataset.p; render(); }
  else if(a==='allQuotes') go('journal',{jKind:'quote',jBook:'all'});
  else if(a==='search') go('journal',{jSearch:''});
  else if(a==='viewEntry') viewSheet(t.dataset.id);
  else if(a==='list'){ Object.assign(ui,{list:t.dataset.k,era:'all',fRegion:'all',fStatus:'all'}); render(); }
  else if(a==='fStatus'){ ui.fStatus=ui.fStatus===t.dataset.k?'all':t.dataset.k; render(); }
  else if(a==='era'){ ui.era=t.dataset.k; render(); }
  else if(a==='filters') filtersSheet();
  else if(a==='resetF'){ Object.assign(ui,{fStatus:'all',fRegion:'all',era:'all',q:'',sort:'chrono'}); render(); }
  else if(a==='addBook') addBookSheet();
  else if(a==='bookTab'){ ui.bookTab=t.dataset.k; render(); }
  else if(a==='jKind'){ ui.jKind=t.dataset.k; render(); }
  else if(a==='jBook'){ ui.jBook=ui.jBook===t.dataset.id?'all':t.dataset.id; render(); }
  else if(a==='jPick') journalPicker();
  else if(a==='calendar') calendarSheet();
  else if(a==='jAllDays'){ ui.jDay=null; render(); }
  else if(a==='jSearchOpen'){ ui.jSearch=ui.jSearch==null?'':null; render(); setTimeout(()=>$('jq')?.focus(),20); }
  else if(a==='jSearchClose'){ ui.jSearch=null; render(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='lq'){ ui.q=e.target.value; render(); } if(e.target.id==='jq'){ ui.jSearch=e.target.value; render(); } });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(['home','lists','journal'].includes(h)&&h!==ui.view) go(h); });

render(); initStore();
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
